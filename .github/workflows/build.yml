# Builds MPC3K Delay for Windows and Mac on GitHub's machines.
#
# - Every push: builds both, runs the core tests, and keeps the zips as
#   downloadable "artifacts" on the Actions tab (good for checking it works).
# - Push a version tag (e.g. v0.1.0): also makes a GitHub Release with
#   the Windows and Mac zips attached, ready to send to friends.

name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------- Windows package ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/Mpc3kDelay_artefacts/Release"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$out/VST3/MPC3K Delay.vst3" stage/
          Copy-Item "$out/Standalone/MPC3K Delay.exe" stage/
          Copy-Item packaging/README-Windows.txt stage/README.txt
          Compress-Archive -Path stage/* -DestinationPath "MPC3K-Delay-Windows.zip"

      # ---------- Mac package ----------
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          out="build/Mpc3kDelay_artefacts/Release"
          mkdir -p "stage/MPC3K Delay"
          cp -R "$out/VST3/MPC3K Delay.vst3"      "stage/MPC3K Delay/"
          cp -R "$out/AU/MPC3K Delay.component"   "stage/MPC3K Delay/"
          cp -R "$out/Standalone/MPC3K Delay.app" "stage/MPC3K Delay/"
          cp packaging/README-Mac.txt             "stage/MPC3K Delay/README.txt"
          cp packaging/install-mac.command        "stage/MPC3K Delay/Install.command"
          chmod +x "stage/MPC3K Delay/Install.command"
          # "Ad-hoc" signing: free, required for Apple Silicon. It is not the paid
          # Apple signing, so macOS still asks the user to approve it once.
          codesign --force --deep --sign - "stage/MPC3K Delay/MPC3K Delay.vst3"
          codesign --force --deep --sign - "stage/MPC3K Delay/MPC3K Delay.component"
          codesign --force --deep --sign - "stage/MPC3K Delay/MPC3K Delay.app"
          # ditto keeps the app bundles intact (plain zip can break them).
          ditto -c -k --sequesterRsrc --keepParent "stage/MPC3K Delay" "MPC3K-Delay-Mac.zip"

      - name: Keep the zip (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: MPC3K-Delay-${{ matrix.name }}
          path: MPC3K-Delay-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
